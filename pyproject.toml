[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "auditable-scientist-lab"
version = "0.1.0"
description = "Offline-first, replayable and evidence-aware scientific discovery workbench"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3",
  "sympy>=1.12,<2",
  "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]

[project.scripts]
auditable-scientist = "auditable_scientist.cli_v3:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auditable_scientist = [
  "_resources/*.toml",
  "_resources/*.zip",
  "_resources/schemas/*.json",
  "_resources/docs/*.md",
  "_resources/examples/*/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
