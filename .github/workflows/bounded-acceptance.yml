name: bounded acceptance

on:
  push:
    branches:
      - main
      - publish/integration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: tests / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: '3.10'
          - os: ubuntu-latest
            python-version: '3.12'
          - os: windows-latest
            python-version: '3.12'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]' && python -m pip install openpyxl==3.1.5 pypdf==6.15.0
      - name: Run unit and contract tests
        run: python -m pytest -q
      - name: Check tracked text for whitespace errors
        shell: bash
        run: git diff --check

  replay-and-wheel:
    name: Windows 3.12.3 / acceptance + wheel replay
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up recorded replay interpreter
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'
          cache: pip
      - name: Install the recorded dependency closure
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]' -c requirements-replay-win-py312.txt
      - name: Verify dependency closure
        run: python -m pip check
      - name: Verify committed replay environment
        run: python scripts/verify_replay_environment.py
      - name: Verify T1-T5 acceptance receipts
        run: python scripts/verify_acceptance.py
      - name: Verify optional acceptance projection
        run: python scripts/sync_optional_acceptance.py --verify
      - name: Verify clean wheel installation and replay
        run: python scripts/verify_wheel_install.py
      - name: Upload wheel audit receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wheel-audit-windows-py3123
          path: artifacts/wheel-audit.json
          if-no-files-found: error

  release-gate:
    name: bounded release gate
    runs-on: ubuntu-latest
    needs:
      - tests
      - replay-and-wheel
    steps:
      - name: Report gate completion
        run: echo "T1-T5 bounded engineering checks passed; scientific/publication gates remain explicit in docs/RELEASE_V0.1.0_BOUNDED.md"
